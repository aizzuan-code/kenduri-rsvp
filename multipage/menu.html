<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenduri RSVP — Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Izzat &amp; Aisyah's Kenduri</h1>
    <p>Dewan Seri Melati, Shah Alam · 12 Dec 2026</p>
  </header>

  <div id="chips"></div>

  <section>
    <h2>Step 3 · Pick your dishes</h2>
    <p style="color:var(--muted);font-size:0.9rem">Choose <b id="need">1</b> dish (one plate per person). Tap to select, tap again to change.</p>

    <div class="dish-grid" id="dishes"></div>

    <label style="margin-top:16px">Dietary needs (optional)</label>
    <div class="pill-row">
      <button type="button" class="pill" data-d="vegetarian" onclick="toggleDietary('vegetarian')">🌱 Vegetarian</button>
      <button type="button" class="pill" data-d="allergy" onclick="toggleDietary('allergy')">⚠️ Food allergy</button>
      <button type="button" class="pill" data-d="lessspicy" onclick="toggleDietary('lessspicy')">🌶️ Less spicy</button>
    </div>

    <p class="error" id="error"></p>
    <div class="btn-row">
      <a class="btn secondary" href="members.html">← Back</a>
      <button class="btn" onclick="next()">Continue →</button>
    </div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
  const draft = loadDraft();
  let picked = (draft.dishes || []).slice();
  let dietary = (draft.dietary || []).slice();
  const pax = 1 + (draft.members || []).length;

  document.getElementById("need").textContent = pax;

  const grid = document.getElementById("dishes");
  KENDURI.dishes.forEach(d => {
    const card = document.createElement("div");
    card.className = "dish-card";
    card.innerHTML = dishArt(d.id) + `<div class="dish-name">${d.name}</div><div class="dish-sub">${d.sub}</div>`;
    card.onclick = () => toggleDish(d.id);
    grid.appendChild(card);
  });

  function toggleDish(id) {
    const i = picked.indexOf(id);
    if (i >= 0) picked.splice(i, 1);
    else if (picked.length < pax) picked.push(id);
    else { document.getElementById("error").textContent = `You picked all ${pax} plates already — tap a dish to unselect it first.`; return; }
    document.getElementById("error").textContent = "";
    sync();
  }
  function toggleDietary(d) {
    const i = dietary.indexOf(d);
    if (i >= 0) dietary.splice(i, 1); else dietary.push(d);
    sync();
  }
  function sync() {
    document.querySelectorAll(".dish-card").forEach((c, i) =>
      c.classList.toggle("selected", picked.includes(KENDURI.dishes[i].id)));
    document.querySelectorAll(".pill[data-d]").forEach(p =>
      p.classList.toggle("selected", dietary.includes(p.dataset.d)));
    const left = pax - picked.length;
    document.getElementById("need").textContent = left > 0 ? left : "✓ all";
  }
  sync();

  function next() {
    if (picked.length !== pax) {
      document.getElementById("error").textContent = `Please pick exactly ${pax} dish(es) — one per person.`;
      return;
    }
    saveDraft({ dishes: picked.slice(), dietary: dietary.slice() });
    location.href = "extras.html";
  }
  document.getElementById('chips').innerHTML = stepChips(3);
</script>
</body>
</html>
